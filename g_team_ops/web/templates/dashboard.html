{% extends "base.html" %}
{% block title %}工作台 · G组运营工作台{% endblock %}
{% block portal_content %}
<section class="portal-home" aria-labelledby="dashboard-title">
  <div class="portal-intro">
    <div class="portal-eyebrow">G TEAM · OPERATIONS HUB</div>
    <h1 id="dashboard-title"><span data-greeting>欢迎回来</span>，{{ account.display_name }}</h1>
    <p>所有运营工具都在这里。选择一个入口，开始今天的工作。</p>
    <div class="portal-status"><span class="portal-signal">本机工作区运行中</span><span data-today>今天</span></div>
  </div>

  <nav class="portal-dock" aria-label="功能入口">
    <a class="portal-entry" href="/tracking" title="物流查询" aria-label="进入物流查询"><span><svg><use href="#icon-search"></use></svg></span><strong>物流查询</strong></a>
    <a class="portal-entry" href="/carriers" title="货代连接" aria-label="进入货代连接"><span><svg><use href="#icon-link"></use></svg></span><strong>货代连接</strong></a>
    <a class="portal-entry" href="/shops" title="我的店铺" aria-label="进入我的店铺"><span><svg><use href="#icon-shop"></use></svg></span><strong>我的店铺</strong></a>
    <a class="portal-entry" href="/inventory" title="库存销售表格" aria-label="进入库存销售表格"><span><svg><use href="#icon-table"></use></svg></span><strong>库存销售</strong></a>
    <a class="portal-entry" href="/operations" title="操作历史与恢复" aria-label="进入操作历史与恢复"><span><svg><use href="#icon-history"></use></svg></span><strong>操作恢复</strong></a>
    {% if account and account.is_admin %}
    <a class="portal-entry" href="/admin" title="账号管理" aria-label="进入账号管理"><span><svg><use href="#icon-users"></use></svg></span><strong>账号管理</strong></a>
    {% endif %}
  </nav>
</section>
{% endblock %}
