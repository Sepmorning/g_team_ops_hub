<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}"><title>修改密码 · G组运营工作台</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script>(()=>{try{const t=localStorage.getItem('g_team_ops_theme');document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(_){document.documentElement.dataset.theme='light'}})();</script>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/app.css">
</head><body class="auth-page" data-page="auth">
<div class="auth-shell">
  <section class="auth-brand"><div class="brand">G TEAM OPS</div><h1>保护你的<br>工作台账号</h1><p>密码修改后立即生效。管理员只能重置临时密码，无法查看你的密码。</p></section>
  <section class="auth-card"><h2>{{ '首次登录，请修改密码' if account.must_change_password else '修改登录密码' }}</h2><p>新密码至少8位，建议不要与货代账号共用。</p>
    {% if error %}<div class="status show error">{{ error }}</div>{% endif %}
    <form method="post" action="/change-password"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field"><label>当前密码</label><input type="password" name="old_password" required></div>
      <div class="field"><label>新密码</label><input type="password" name="new_password" minlength="8" required></div>
      <div class="field"><label>确认新密码</label><input type="password" name="confirm_password" minlength="8" required></div>
      <button class="btn primary" type="submit">保存新密码</button>
    </form>
    {% if not account.must_change_password %}<a href="/dashboard" class="muted" style="margin-top:18px;text-align:center">返回工作台</a>{% endif %}
  </section>
</div></body></html>
